<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grill archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <style>
      /* Generated by the grill-capture skill. Overwritten on every save, so
         edit the skill rather than this file. Palette matches docs/html. */

      :root {
        --basalt: #16191d;
        --ash: #eef0ec;
        --surface: #f9faf8;
        --slate: #5c656e;
        --sulphur: #9c6f14;
        --geothermal: #1d6b66;
        --line: #d6dad4;
        --line-soft: #e4e7e2;
        --inset: #e7eae5;
        --ink: var(--basalt);
        --ground: var(--ash);
        --measure: 68ch;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ash: #14171a;
          --surface: #1b1f23;
          --slate: #9aa4ad;
          --line: #2b3137;
          --line-soft: #23282d;
          --inset: #20252a;
          --sulphur: #d6a03c;
          --geothermal: #5fb3ac;
          --ink: #e6e9e4;
          --ground: var(--ash);
          color-scheme: dark;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Helvetica, Arial, sans-serif;
        font-size: 1rem;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      main { max-width: var(--measure); margin: 0 auto; padding: 2.5rem 1rem 6rem; }

      h1 { font-family: "Instrument Serif", Georgia, serif; font-size: 2rem; font-weight: 400; margin: 0 0 0.25rem; }
      h2 { font-size: 1.1875rem; margin: 0 0 0.5rem; }

      .lede { color: var(--slate); margin: 0 0 2rem; font-size: 0.8125rem; }

      a { color: var(--geothermal); }

      .back {
        display: inline-block; margin-bottom: 1.5rem; color: var(--slate);
        text-decoration: none; font-size: 0.8125rem; font-family: "IBM Plex Mono", monospace;
      }
      .back:hover { color: var(--ink); }

      .row {
        display: block; width: 100%; text-align: left; cursor: pointer;
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 6px; padding: 0.9rem 1rem; margin-bottom: 0.5rem;
        color: inherit; font: inherit;
      }
      .row:hover { border-color: var(--slate); }
      .row-top { display: flex; align-items: baseline; gap: 0.75rem; justify-content: space-between; }
      .row-title { font-weight: 600; }
      .row-meta { color: var(--slate); font-size: 0.75rem; font-family: "IBM Plex Mono", monospace; }

      .tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.4rem; }
      .tag {
        font-family: "IBM Plex Mono", monospace; font-size: 0.6875rem;
        padding: 0.1rem 0.45rem; border-radius: 3px; border: 1px solid var(--line);
        color: var(--slate);
      }
      .tag.ok { color: var(--geothermal); border-color: var(--geothermal); }
      .tag.warn { color: var(--sulphur); border-color: var(--sulphur); }

      .qnum { font-family: "IBM Plex Mono", monospace; color: var(--sulphur); font-weight: 600; }

      .prose { max-width: 100%; }
      .prose p { margin: 0 0 0.9rem; }
      .prose ul, .prose ol { margin: 0 0 0.9rem; padding-left: 1.2rem; }
      .prose code {
        font-family: "IBM Plex Mono", monospace; font-size: 0.875em;
        background: var(--inset); padding: 0.1em 0.35em; border-radius: 3px;
      }

      .suggestion {
        border-left: 2px solid var(--geothermal); padding: 0.1rem 0 0.1rem 1rem;
        margin: 1.25rem 0;
      }
      .suggestion .label {
        font-family: "IBM Plex Mono", monospace; font-size: 0.6875rem;
        text-transform: uppercase; letter-spacing: 0.06em; color: var(--geothermal);
        display: block; margin-bottom: 0.35rem;
      }
      .revision { border-left-color: var(--sulphur); }
      .revision .label { color: var(--sulphur); }

      label.check {
        display: flex; align-items: center; gap: 0.5rem; margin: 0.75rem 0;
        font-size: 0.875rem; cursor: pointer;
      }

      textarea {
        width: 100%; min-height: 9rem; padding: 0.75rem; border-radius: 6px;
        border: 1px solid var(--line); background: var(--surface); color: var(--ink);
        font: inherit; line-height: 1.6; resize: vertical;
      }
      textarea:focus { outline: 2px solid var(--geothermal); outline-offset: -1px; }
      textarea:disabled { opacity: 0.45; cursor: not-allowed; }

      .actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; flex-wrap: wrap; }

      button.primary, button.ghost {
        font: inherit; cursor: pointer; border-radius: 6px; padding: 0.55rem 1.1rem;
      }
      button.primary { background: var(--ink); color: var(--ground); border: 1px solid var(--ink); }
      button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      button.ghost:hover { border-color: var(--slate); }

      .banner {
        background: var(--inset); border: 1px solid var(--sulphur); color: var(--ink);
        border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 1.25rem;
        font-size: 0.875rem; cursor: pointer;
      }

      .flash { color: var(--geothermal); font-size: 0.8125rem; margin-top: 0.75rem; min-height: 1.2em; }

      .empty { color: var(--slate); font-style: italic; }

      hr { border: 0; border-top: 1px solid var(--line-soft); margin: 2rem 0; }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <script>
      "use strict";

      const POLL_MS = 3000;
      const AGREED = "I agree with your suggestion.";

      const state = {
        subjects: {},
        order: [],
        view: { name: "list" },
        stale: false,
        staleTarget: null,
        loaded: false,
        error: null,
      };

      // ---- drafts (browser only, until pasted into Claude) ----

      function draftKey(slug) { return "grill:" + slug; }

      function readDraft(slug) {
        try {
          return JSON.parse(localStorage.getItem(draftKey(slug))) || { answers: {}, notes: {} };
        } catch { return { answers: {}, notes: {} }; }
      }

      function writeDraft(slug, draft) {
        try { localStorage.setItem(draftKey(slug), JSON.stringify(draft)); } catch {}
      }

      // ---- model helpers ----

      function roundQuestions(subject, round) {
        return subject.questions.filter((q) => q.round === round).sort((a, b) => a.number - b.number);
      }

      function effectiveAnswer(subject, question) {
        const draft = readDraft(subject.slug).answers[question.number];
        if (draft) return { text: draft.agreed ? AGREED : draft.text, agreed: !!draft.agreed, saved: false };
        if (question.answer) return { text: question.answer, agreed: !!question.agreed, saved: true };
        return null;
      }

      function isAnswered(subject, question) {
        const a = effectiveAnswer(subject, question);
        return !!(a && a.text && a.text.trim());
      }

      function fullyAnsweredOnDisk(subject) {
        return subject.questions.length > 0 && subject.questions.every((q) => q.answer && q.answer.trim());
      }

      function hasUnsaved(subject) {
        const draft = readDraft(subject.slug);
        return Object.keys(draft.answers).length > 0 || Object.keys(draft.notes).length > 0;
      }

      function currentSuggestion(question) {
        const withSuggestion = (question.revisions || []).filter((r) => r.suggestion);
        return withSuggestion.length ? withSuggestion[withSuggestion.length - 1].suggestion : question.suggestion;
      }

      function suggestionVersion(question) {
        return (question.revisions || []).filter((r) => r.suggestion).length;
      }

      function revisedSinceAnswered(question) {
        if (!question.answered_at) return false;
        return (question.revisions || []).some((r) => r.added_at && r.added_at > question.answered_at);
      }

      function nextUnanswered(subject, round, after) {
        return roundQuestions(subject, round).find((q) => q.number > after && !isAnswered(subject, q)) ||
               roundQuestions(subject, round).find((q) => !isAnswered(subject, q)) || null;
      }

      // ---- minimal markdown ----

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function inline(s) {
        return escapeHtml(s)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
          .replace(/_([^_]+)_/g, "<em>$1</em>");
      }

      function markdown(src) {
        if (!src) return "";
        const blocks = String(src).split(/\n{2,}/);
        return blocks.map((block) => {
          const lines = block.split("\n");
          if (lines.every((l) => /^\s*[-*]\s+/.test(l))) {
            return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*]\s+/, "")) + "</li>").join("") + "</ul>";
          }
          if (lines.every((l) => /^\s*\d+\.\s+/.test(l))) {
            return "<ol>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*\d+\.\s+/, "")) + "</li>").join("") + "</ol>";
          }
          return "<p>" + lines.map(inline).join("<br />") + "</p>";
        }).join("");
      }

      function shortDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
      }

      // ---- loading ----

      async function loadAll() {
        const index = await fetch("./subjects.json", { cache: "no-store" });
        if (!index.ok) throw new Error("subjects.json is missing. Nothing has been captured yet.");
        const { subjects: slugs } = await index.json();

        const loaded = {};
        for (const slug of slugs || []) {
          try {
            const res = await fetch("./" + encodeURIComponent(slug) + ".json", { cache: "no-store" });
            if (res.ok) loaded[slug] = await res.json();
          } catch {}
        }
        return loaded;
      }

      // Identifies the questions that were not there before, so the banner can
      // send the reader straight to the first of them.
      function describeChange(before, after) {
        if (!before || !after) return null;
        const seen = new Set(before.questions.map((q) => q.number));
        const fresh = after.questions
          .filter((q) => !seen.has(q.number))
          .sort((a, b) => a.number - b.number);
        if (fresh.length === 0) return null;
        return {
          message:
            "Round " + fresh[0].round + " arrived, " + fresh.length +
            " new question" + (fresh.length === 1 ? "" : "s") + ". Click to open the first.",
          slug: after.slug,
          number: fresh[0].number,
        };
      }

      function digest(subjects) {
        return Object.values(subjects)
          .map((s) => s.slug + ":" + s.updated_at + ":" + s.questions.length + ":" + (s.synthesis ? 1 : 0))
          .sort().join("|");
      }

      async function refresh(initial) {
        let subjects;
        try {
          subjects = await loadAll();
          state.error = null;
        } catch (err) {
          if (initial) { state.error = err.message; state.loaded = true; render(); }
          return;
        }

        const changed = digest(subjects) !== digest(state.subjects);
        if (changed) {
          const change = describeChange(state.subjects[state.view.slug], subjects[state.view.slug]);
          state.staleMessage = change ? change.message : null;
          // Keep the earliest target while a banner is already up, so a second
          // round landing does not move the destination past unseen questions.
          if (change && !state.staleTarget) {
            state.staleTarget = { slug: change.slug, number: change.number };
          }
        }
        state.subjects = subjects;
        state.order = Object.values(subjects)
          .sort((a, b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")))
          .map((s) => s.slug);
        state.loaded = true;

        // Never re-render a question or note screen from under the user: their
        // typing lives in the DOM until it is committed to the draft.
        const editing = state.view.name === "question" || state.view.name === "note";
        if (changed && editing && !initial) { state.stale = true; renderBannerOnly(); return; }
        if (changed || initial) render();
      }

      // ---- rendering ----

      const app = document.getElementById("app");

      function h(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }

      function renderBannerOnly() {
        if (document.getElementById("stale-banner")) return;
        const banner = document.createElement("div");
        banner.id = "stale-banner";
        banner.className = "banner";
        banner.textContent = state.staleMessage || "This session changed on disk. Click to load it.";
        banner.onclick = () => {
          state.stale = false;
          const target = state.staleTarget;
          state.staleTarget = null;
          // Safe to leave the current question: its draft is saved on every keystroke.
          if (target) state.view = { name: "question", slug: target.slug, number: target.number };
          render();
        };
        app.prepend(banner);
      }

      function render() {
        app.innerHTML = "";
        if (!state.loaded) { app.append(h('<p class="empty">Loading.</p>')); return; }
        if (state.error) {
          app.append(h('<h1>Grill archive</h1><p class="empty">' + escapeHtml(state.error) + "</p>"));
          return;
        }
        if (state.view.name === "list") return renderList();
        if (state.view.name === "subject") return renderSubject();
        if (state.view.name === "question") return renderQuestion();
        if (state.view.name === "note") return renderNote();
      }

      function renderList() {
        app.append(h("<h1>Grill archive</h1><p class=\"lede\">Sessions, most recently touched first.</p>"));
        if (!state.order.length) { app.append(h('<p class="empty">Nothing captured yet.</p>')); return; }

        for (const slug of state.order) {
          const s = state.subjects[slug];
          const tags = [];
          if (fullyAnsweredOnDisk(s)) tags.push('<span class="tag ok">&#10003; Answered</span>');
          if (hasUnsaved(s)) tags.push('<span class="tag warn">Not yet saved to disk</span>');
          if (s.status && s.status !== "open") tags.push('<span class="tag">' + escapeHtml(s.status) + "</span>");
          for (const adr of s.adrs || []) tags.push('<span class="tag">' + escapeHtml(adr.split("/").pop()) + "</span>");

          const btn = h(
            '<button class="row"><span class="row-top"><span class="row-title">' +
            escapeHtml(s.title || s.slug) +
            '</span><span class="row-meta">' + shortDate(s.updated_at) + "</span></span>" +
            '<span class="tags">' + tags.join("") + "</span></button>"
          ).firstElementChild;
          btn.onclick = () => { state.view = { name: "subject", slug }; render(); };
          app.append(btn);
        }
      }

      function renderSubject() {
        const s = state.subjects[state.view.slug];
        if (!s) { state.view = { name: "list" }; return render(); }

        const back = h('<a class="back" href="#">&larr; All sessions</a>').firstElementChild;
        back.onclick = (e) => { e.preventDefault(); state.view = { name: "list" }; render(); };
        app.append(back);
        app.append(h("<h1>" + escapeHtml(s.title || s.slug) + "</h1>"));

        if (s.synthesis) {
          app.append(h('<div class="suggestion"><span class="label">Synthesis</span><div class="prose">' + markdown(s.synthesis) + "</div></div>"));
        }

        let round = null;
        for (const q of [...s.questions].sort((a, b) => a.number - b.number)) {
          if (q.round !== round) {
            round = q.round;
            const note = (s.rounds.find((r) => r.round === round) || {}).note;
            app.append(h('<hr /><p class="row-meta">Round ' + round + (note ? " &middot; has a note" : "") + "</p>"));
          }
          const tags = [];
          if (isAnswered(s, q)) tags.push('<span class="tag ok">&#10003; Answered</span>');
          if (revisedSinceAnswered(q)) tags.push('<span class="tag warn">Revised since you answered</span>');

          const btn = h(
            '<button class="row"><span class="row-top"><span class="row-title"><span class="qnum">Q' + q.number +
            "</span> " + escapeHtml(q.title) + '</span></span><span class="tags">' + tags.join("") + "</span></button>"
          ).firstElementChild;
          btn.onclick = () => { state.view = { name: "question", slug: s.slug, number: q.number }; render(); };
          app.append(btn);
        }
      }

      function renderQuestion() {
        const s = state.subjects[state.view.slug];
        const q = s && s.questions.find((x) => x.number === state.view.number);
        if (!q) { state.view = { name: "subject", slug: state.view.slug }; return render(); }

        const back = h('<a class="back" href="#">&larr; ' + escapeHtml(s.title || s.slug) + "</a>").firstElementChild;
        back.onclick = (e) => { e.preventDefault(); commit(); state.view = { name: "subject", slug: s.slug }; render(); };
        app.append(back);

        app.append(h('<h2><span class="qnum">Q' + q.number + "</span> " + escapeHtml(q.title) + "</h2>"));
        app.append(h('<div class="prose">' + markdown(q.body) + "</div>"));
        app.append(h('<div class="suggestion"><span class="label">Suggestion</span><div class="prose">' + markdown(q.suggestion) + "</div></div>"));

        for (const rev of q.revisions || []) {
          app.append(h(
            '<div class="suggestion revision"><span class="label">Revised in round ' + rev.round + '</span><div class="prose">' +
            markdown(rev.text) + (rev.suggestion ? "<p><strong>Recommendation now:</strong></p>" + markdown(rev.suggestion) : "") +
            "</div></div>"
          ));
        }

        if (revisedSinceAnswered(q)) {
          app.append(h('<p class="tag warn">This was revised after you answered it.</p>'));
        }

        const existing = effectiveAnswer(s, q);
        const checkbox = h('<label class="check"><input type="checkbox" /> Agree with suggestion</label>').firstElementChild;
        const input = checkbox.querySelector("input");
        const area = h("<textarea></textarea>").firstElementChild;
        area.placeholder = "Your answer";
        if (existing) { input.checked = existing.agreed; area.value = existing.agreed ? "" : existing.text; }
        syncDisabled();

        function syncDisabled() {
          area.disabled = input.checked;
        }
        input.onchange = () => { syncDisabled(); commit(); };

        app.append(checkbox);
        app.append(area);

        // Scoped to this question's own round, not the newest one: a note added
        // while reading a round 1 question belongs to round 1.
        const round = q.round;
        const remaining = () => roundQuestions(s, round).filter((x) => !isAnswered(s, x) && x.number !== q.number).length;

        const actions = document.createElement("div");
        actions.className = "actions";

        const primary = document.createElement("button");
        primary.className = "primary";
        const noteBtn = document.createElement("button");
        noteBtn.className = "ghost";
        noteBtn.textContent = "Add note";
        noteBtn.onclick = () => { commit(); state.view = { name: "note", slug: s.slug, round }; render(); };

        const flash = document.createElement("p");
        flash.className = "flash";

        function refreshPrimary() {
          const answeredHere = input.checked || area.value.trim().length > 0;
          const left = remaining() + (answeredHere ? 0 : 1);
          primary.textContent = left > 0 ? "Answer next question" : "Copy answers and save";
        }
        refreshPrimary();
        // Persist on every keystroke: anything living only in the DOM is lost
        // when the view re-renders or the tab closes.
        area.oninput = () => { commit(); refreshPrimary(); };
        input.addEventListener("change", refreshPrimary);

        primary.onclick = async () => {
          commit();
          const next = nextUnanswered(s, round, q.number);
          if (next) { state.view = { name: "question", slug: s.slug, number: next.number }; render(); return; }
          const text = buildBlock(s, round);
          try {
            await navigator.clipboard.writeText(text);
            flash.textContent = "Copied. Paste it into Claude to save it to disk.";
          } catch {
            flash.textContent = "Could not reach the clipboard. Select and copy the block below.";
            const pre = document.createElement("textarea");
            pre.value = text;
            app.append(pre);
          }
        };

        function commit() {
          const draft = readDraft(s.slug);
          const agreed = input.checked;
          const text = area.value.trim();
          if (agreed) draft.answers[q.number] = { agreed: true, text: AGREED };
          else if (text) draft.answers[q.number] = { agreed: false, text };
          else delete draft.answers[q.number];
          writeDraft(s.slug, draft);
        }

        actions.append(primary, noteBtn);
        app.append(actions, flash);
      }

      function renderNote() {
        const s = state.subjects[state.view.slug];
        const round = state.view.round;
        const back = h('<a class="back" href="#">&larr; ' + escapeHtml(s.title || s.slug) + "</a>").firstElementChild;
        back.onclick = (e) => { e.preventDefault(); save(); state.view = { name: "subject", slug: s.slug }; render(); };
        app.append(back);

        app.append(h("<h2>Note for round " + round + "</h2>"));
        app.append(h('<p class="lede">Not attached to any question. It is copied beneath the answers.</p>'));

        const draft = readDraft(s.slug);
        const stored = (s.rounds.find((r) => r.round === round) || {}).note;
        const area = h("<textarea></textarea>").firstElementChild;
        area.value = draft.notes[round] != null ? draft.notes[round] : (stored || "");
        area.oninput = () => save();
        app.append(area);

        function save() {
          const d = readDraft(s.slug);
          const v = area.value.trim();
          if (v) d.notes[round] = v; else delete d.notes[round];
          writeDraft(s.slug, d);
        }

        const done = document.createElement("button");
        done.className = "primary";
        done.textContent = "Done";
        done.onclick = () => { save(); state.view = { name: "subject", slug: s.slug }; render(); };
        const actions = document.createElement("div");
        actions.className = "actions";
        actions.append(done);
        app.append(actions);
      }

      function buildBlock(subject, round) {
        const lines = roundQuestions(subject, round).map((q) => {
          const a = effectiveAnswer(subject, q);
          return "Q" + q.number + ": " + (a ? a.text : "");
        });
        const draft = readDraft(subject.slug);
        const stored = (subject.rounds.find((r) => r.round === round) || {}).note;
        const note = draft.notes[round] != null ? draft.notes[round] : stored;
        if (note && note.trim()) lines.push("Note: " + note.trim());
        return lines.join("\n");
      }

      refresh(true);
      setInterval(() => refresh(false), POLL_MS);
    </script>
  </body>
</html>
